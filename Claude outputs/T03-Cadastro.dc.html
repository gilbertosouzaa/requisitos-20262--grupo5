<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>T03 Cadastro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.wf{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1a1a1a;font-size:15px;line-height:1.45}
.wf *{box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border:2px solid #1a1a1a;border-radius:8px;background:#fff;color:#1a1a1a;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn-p{background:#1a1a1a;color:#fff}
a.btn-p:hover{color:#fff}
.ph{display:flex;align-items:center;justify-content:center;border:1.5px dashed #777;background:#f0f0f0;color:#555;font-size:13px;text-align:center}
.lbl{font-size:14px;font-weight:600}
.inp{width:100%;min-height:44px;padding:0 12px;border:1.5px solid #555;border-radius:6px;font:inherit;background:#fff;color:#1a1a1a}
.muted{color:#555}
a{color:#1a1a1a}a:hover{color:#000}
</style>
</helmet>
<div class="wf" style="min-height: 860px; background: #ffffff; display: flex; flex-direction: column">
  <header style="border-bottom: 1.5px solid #1a1a1a">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none">
        <span class="ph" style="width: 32px; height: 32px; border-radius: 6px">logo</span>
        <strong style="font-size: 18px">Apoio ENADE</strong>
      </a>
      <span class="muted">Já tem conta? <a href="T02-Login.dc.html" style="font-weight: 600">Entrar</a></span>
    </div>
  </header>

  <main style="flex: 1; display: flex; flex-wrap: wrap; max-width: 1200px; width: 100%; margin: 0 auto; padding: 40px 24px; gap: 48px; align-items: flex-start">
    <section style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 14px; padding-top: 24px">
      <h1 style="margin: 0; font-size: 32px; line-height: 1.15">Crie sua conta e comece a estudar</h1>
      <p class="muted" style="margin: 0; font-size: 17px">Com a conta você responde questões, faz simulados e acompanha seu desempenho por área.</p>
      <div class="ph" style="height: 240px; border-radius: 12px; margin-top: 8px">[ ilustração ]</div>
    </section>

    <form style="flex: 1 1 400px; max-width: 480px; border: 1.5px solid #1a1a1a; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: 24px">Cadastro</h2>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lbl" for="nome">Nome completo</label>
        <input class="inp" id="nome" type="text" value="Ana Souza">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lbl" for="email">E-mail</label>
        <input class="inp" id="email" type="email" value="ana.souza@email.com" aria-describedby="email-erro" style="border: 2.5px solid #1a1a1a">
        <span id="email-erro" style="display: flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
          E-mail já cadastrado. <a href="T02-Login.dc.html">Entrar</a> ou <a href="T04-Recuperar-senha.dc.html">recuperar senha</a>
        </span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lbl" for="senha">Senha</label>
        <input class="inp" id="senha" type="password" value="" aria-describedby="senha-dica">
        <span id="senha-dica" class="muted" style="font-size: 13px">Mínimo de 8 caracteres</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label class="lbl" for="curso">Curso</label>
        <select class="inp" id="curso">
          <option>Ciência da Computação</option>
          <option>Sistemas de Informação</option>
          <option>Engenharia de Computação</option>
        </select>
      </div>

      <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px">
        <input type="checkbox" style="width: 20px; height: 20px; margin: 1px 0 0; flex: none">
        <span>Li e aceito a <a href="#">Política de Privacidade</a> e os <a href="#">Termos de Uso</a>.</span>
      </label>

      <a class="btn btn-p" href="T05-Inicio.dc.html" style="width: 100%">Criar conta</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>

  renderVals() { return {}; }
}

</body>
</html>
